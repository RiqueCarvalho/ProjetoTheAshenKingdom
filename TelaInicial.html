<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>The Ashen Kingdom</title>
  <link rel="icon" type="image/png" href="./assets/favicon_samurai.png">
  <link rel="stylesheet" href="TelaInicial.css">
</head>

<body>

  <main class="tela-inicial">

    <div class="menu-principal">

      <!-- LOGO DO JOGO -->
      <div class="container-logo">
        <img src="./assets/logo.png" alt="The Ashen Kingdom" class="logo-jogo">
      </div>

      <div class="botoes-menu">

        <button id="btnNovoJogo" class="botao-menu">
          <span>JOGAR</span>
        </button>

        <button id="btnConfiguracoes" class="botao-menu">
          <span>CONFIGURAÇÕES</span>
        </button>

        <button id="btnCreditos" class="botao-menu">
          <span>CRÉDITOS</span>
        </button>

      </div>

    </div>

  </main>

  <!-- CONFIGURAÇÕES -->

  <div class="modal" id="modalConfiguracoes">

    <div class="painel-configuracoes">

      <h1>CONFIGURAÇÕES</h1>

      <div class="opcao">
        <label for="brilho">Brilho</label>

        <select id="brilho">
          <option value="0.7">Baixo</option>
          <option value="1" selected>Médio</option>
          <option value="1.2">Alto</option>
        </select>
      </div>

      <div class="opcao">
        <label for="audio">Áudio</label>

        <select id="audio">
          <option value="off">Desligado</option>
          <option value="on">Ligado</option>
        </select>
      </div>

      <div class="opcao">
        <label for="legendas">Legendas</label>

        <select id="legendas">
          <option value="off">Desligadas</option>
          <option value="on">Ligadas</option>
        </select>
      </div>

      <div class="botoes-configuracao">

        <button id="btnCancelar">VOLTAR</button>

        <button id="btnSalvar">SALVAR</button>

      </div>

    </div>

  </div>

  <script src="TelaInicial.js"></script>

</body>

</html>
