<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>The Last Kingdom</title>
    <link rel="icon" type="image/png" href="../assets/favicon_samurai.png" />
    <link rel="stylesheet" href="CarregamentoHiroshi.css" />
  </head>

  <body>
    <main class="tela-carregamento">
      <div class="sombra"></div>

      <section class="painel-carregamento">
        <div class="titulo-jogo">
          <span class="ornamento">✦ ━━━━━━━━━ ✦</span>
          <h1>THE ASHEN<br /><span>KINGDOM</span></h1>
          <span class="ornamento inferior">━━━━━━━━━ ⚔ ━━━━━━━━━</span>
        </div>

        <p class="subtitulo" id="mensagem">Prepare-se para a jornada...</p>

        <div class="area-barra" id="areaBarra">
          <img
            src="../assets/mago.png"
            alt="Professor mago"
            class="mago"
            id="mago"
          />

          <div class="barra">
            <div class="progresso" id="progresso"></div>
          </div>
        </div>

        <p class="texto-carregamento" id="texto">
          Os portões do reino estão se abrindo...
        </p>
      </section>
    </main>

    <!-- Tag de áudio com o tema medieval -->
    <audio
      id="musicaMedieval"
      src="./Audios/Phil Rey - For Death and Glory.mp3"
      loop
      preload="auto"
    ></audio>

    <script src="CarregamentoHiroshi.js"></script>
  </body>
</html>
