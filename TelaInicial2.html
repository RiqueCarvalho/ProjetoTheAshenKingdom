<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>The Ashen Kingdom - Menu</title>

    <link rel="icon" type="image/png" href="./assets/favicon_samurai.png">
    <link rel="stylesheet" href="TelaInicial2.css">
</head>

<body>

    <main class="menu-principal">

        <!-- LOGO DO JOGO -->
        <div class="container-logo">
            <img src="./assets/logo.png" alt="The Ashen Kingdom" class="logo-jogo">
        </div>

        <!-- BOTÃO VOLTAR -->
        <button id="btnVoltar" class="botao-voltar" onclick="window.location.href='TelaInicial.html'"
            aria-label="Voltar para a tela inicial">

            <img src="./assets/anterior.png" alt="Voltar">

        </button>

        <!-- BOTÕES DO MENU -->
        <div class="botoes-menu">

            <button id="btnEscolherPersonagem" class="botao-menu">
                <span>ESCOLHER PERSONAGEM</span>
            </button>

            <button id="btnMercado" class="botao-menu">
                <span>MERCADO / LOJA</span>
            </button>

        </div>

    </main>

    <!-- =====================================
         MODAL DA PEGADINHA DO MERCADO
    ====================================== -->

    <div id="modalMercado" class="modal-mercado" hidden>

        <div class="modal-mercado-conteudo">

            <h2>📢 ATENÇÃO, TORCEDOR!</h2>

            <div class="icone-narrador">
                🎙️
            </div>

            <p>
                Bem amigos da Rede Globo, gostaria de informar que você só conseguirá
                acessar com a versão paga essa tela!
            </p>

            <p class="frase-pix">
                Será no PIX ou aproximação, meu amigo ou minha amiga?
            </p>

            <button id="btnOkMercado">
                OK
            </button>

        </div>

    </div>

    <script src="musica.js"></script>
    <script src="TelaInicial2.js"></script>

</body>

</html>
